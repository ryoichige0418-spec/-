*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;color:#e9eee8;background:#20322f;font-family:'Deck Sans','Noto Sans CJK JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif}
#viewer{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
#frames{width:min(100%,1480px);display:flex;flex-direction:column;gap:16px;touch-action:pan-y pinch-zoom}
.slide-frame{width:100%;aspect-ratio:16/9;background:#faf8f0;box-shadow:0 5px 30px #08161255}
.slide-frame .slide{display:block;width:100%;height:100%;aspect-ratio:16/9}
.slide-frame a:focus-visible{outline:3px solid #dc884b;outline-offset:3px}
.controls{display:none;align-items:center;justify-content:space-between;gap:12px;min-height:46px}
#viewer.deck-ready #frames,.deck-ready .controls{width:min(100%,calc((100vh - 96px) * 16 / 9),1640px);width:min(100%,calc((100dvh - 96px) * 16 / 9),1640px)}
.deck-ready .controls{display:grid;grid-template-columns:1fr auto 1fr}
@media screen{#viewer.deck-ready .slide-frame:not(.active){display:none}}
.controls a,.controls button{line-height:1.2;font-family:inherit;font-size:14px;font-weight:500;text-decoration:none;color:#e8eee6;background:transparent;border:1px solid transparent;display:inline-flex;justify-content:center;align-items:center;min-height:38px;border-radius:5px;cursor:pointer;white-space:nowrap}
.controls button{padding:5px 11px}.controls a:focus-visible,.controls button:focus-visible{outline:2px solid #f2cb87;outline-offset:2px}
.pagenav,.paging,.actions{display:flex;align-items:center;gap:4px}
.pagenav a{min-width:34px;min-height:34px;font-family:system-ui,sans-serif;color:#cbd9d1}.pagenav a[aria-current=page]{background:#d1e7d6;color:#203b32;font-weight:700}
.paging button{border-color:#677e73;gap:6px}.paging button:disabled{opacity:.35;cursor:default}
.paging output{padding:0 13px;font:500 14px/1.3 system-ui,sans-serif;white-space:nowrap;color:#e0e9df;font-variant-numeric:tabular-nums}.actions{justify-content:end}
.controls button:hover:not(:disabled),.pagenav a:hover{background:#40554b;color:white}
[hidden]{display:none!important}
@media(max-width:680px){#viewer{padding:6px;gap:10px}.deck-ready .controls{display:flex;justify-content:center;gap:13px}.pagenav{display:none}.actions{gap:0}.controls button{min-height:42px}.paging output{padding:0 8px}}
@media(max-height:560px) and (orientation:landscape){#viewer{padding:4px;gap:2px}.controls{min-height:34px}#viewer.deck-ready #frames,.deck-ready .controls{width:min(100%,calc((100vh - 47px) * 16 / 9));width:min(100%,calc((100dvh - 47px) * 16 / 9))}.controls button,.pagenav a{min-height:30px}}
@page{size:320mm 180mm;margin:0}
@media print{html,body{background:white;margin:0;padding:0;height:auto;min-height:0}.controls,.deck-ready .controls{display:none!important}#viewer,#viewer.deck-ready{display:block;min-height:0;height:auto;padding:0;margin:0}#frames,#viewer.deck-ready #frames{width:320mm;display:block;margin:0;padding:0}.slide-frame,.slide-frame[aria-hidden=true]{display:block!important;visibility:visible!important;width:320mm;height:180mm;aspect-ratio:auto;margin:0;padding:0;box-shadow:none;break-inside:avoid;break-after:page;page-break-after:always} .slide-frame:last-child{break-after:auto;page-break-after:auto}.slide-frame .slide{width:320mm;height:180mm}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

.slide-frame{position:relative}
.controls .jumpwrap{display:flex;gap:8px;align-items:center;min-width:0}
.jumpwrap label{font-size:13px;white-space:nowrap}
#jump{color:#eff4ee;background:#2b403a;border:1px solid #677e73;border-radius:5px;max-width:100%;min-width:0;line-height:1.3;font-family:inherit;font-size:14px;padding:5px 6px;min-height:36px}
#jump option,#jump optgroup{background:#2b403a;color:#eff4ee}
#jump:focus-visible,#practice-force:focus-visible{outline:2px solid #aa7134;outline-offset:3px}
#practice-force{display:none;position:absolute;left:18.2%;width:43.5%;top:83.0%;height:5.0%;margin:0;accent-color:#086a61;cursor:pointer;touch-action:auto}
.deck-ready #practice-force{display:block}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:900px){.controls{gap:7px}.jumpwrap label{display:none}}
@media(max-width:680px){.deck-ready .controls{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:3px}.controls .jumpwrap{min-width:0}.actions button,.paging button{padding:4px}.paging output{padding:0 4px}#jump{width:100%}}
@media print{#practice-force,.sr-only{display:none!important}}

<section class="slide-frame" id="s2" aria-label="2枚目　欠陥の分布と評価領域"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" class="slide" role="group" aria-labelledby="title2 desc2" font-family="'Deck Sans','Noto Sans CJK JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif"><title id="title2">欠陥の分布と評価領域</title><desc id="desc2">材料全体に分布する焼結時の気孔や介在物には有効体積を、特定の加工面に分布する研削き裂には有効面積を使います。気孔が底面で見つかっても、同じ種類の気孔が素材全体に分布していれば、体積モデルが候補になります。</desc><rect x="0" y="0" width="1280" height="720" fill="#faf8f0"/><text x="64" y="99" font-size="48" font-weight="700" fill="#192f39" font-family="'Deck Serif','Noto Serif CJK JP','Hiragino Mincho ProN','Yu Mincho',serif">欠陥の分布と評価領域</text><text x="65" y="160" font-size="27" font-weight="400" fill="#192f39">破面から破壊の起点を探し、欠陥の種類と試験片の加工履歴を照合します。</text><line x1="65" y1="197" x2="1217" y2="197" stroke="#c4d1c8" stroke-width="1.6"/><line x1="636" y1="226" x2="636" y2="480" stroke="#c4d1c8" stroke-width="1.6"/><text x="66" y="258" font-size="26" font-weight="600" fill="#086a61">材料全体に分布する欠陥</text><svg xmlns="http://www.w3.org/2000/svg" class="mini" viewBox="0 0 88 46" aria-hidden="true" x="411" y="274" width="173" height="90.43181818181819"><path fill="#e0eee5" stroke="#72968a" d="M4 13l12-8h67v29l-12 8H4z"/><path fill="none" stroke="#72968a" d="M4 13h67l12-8M71 13v29"/><g fill="#327970"><circle cx="15" cy="23" r="2.6"/><circle cx="30" cy="34" r="2"/><circle cx="44" cy="22" r="3"/><circle cx="56" cy="32" r="2.4"/><circle cx="60" cy="18" r="1.6"/></g></svg><text x="670" y="258" font-size="26" font-weight="600" fill="#a64c33">加工面に分布する欠陥</text><svg xmlns="http://www.w3.org/2000/svg" class="mini" viewBox="0 0 88 46" aria-hidden="true" x="1043" y="274" width="166" height="86.77272727272727"><path fill="#f4e5d8" stroke="#b39078" d="M4 13l12-8h67v29l-12 8H4z"/><path fill="none" stroke="#b39078" d="M4 13h67l12-8M71 13v29"/><path d="M4 42h67l12-8" fill="none" stroke="#ad4930" stroke-width="2"/><path d="M19 41l2-5 2 6m15-1l3-7 2 7m15 0l3-5" fill="none" stroke="#a3432d" stroke-width="1.7"/></svg><text x="66" y="340" font-size="48" font-weight="700" fill="#192f39" font-family="'Deck Serif','Noto Serif CJK JP','Hiragino Mincho ProN','Yu Mincho',serif">有効体積</text><text x="670" y="340" font-size="48" font-weight="700" fill="#192f39" font-family="'Deck Serif','Noto Serif CJK JP','Hiragino Mincho ProN','Yu Mincho',serif">有効面積</text><text x="66" y="408" font-size="25" font-weight="400" fill="#192f39">焼結時の気孔や介在物を想定。</text><text x="66" y="452" font-size="25" font-weight="400" fill="#192f39">材料内部の引張域で積分します。</text><text x="670" y="408" font-size="25" font-weight="400" fill="#192f39">研削き裂や取扱い傷を想定。</text><text x="670" y="452" font-size="24" font-weight="400" fill="#192f39">傷が生じる面の引張域で積分します。</text><rect x="65" y="514" width="1151" height="111" fill="#e7eee5"/><text x="89" y="556" font-size="25" font-weight="700" fill="#086a61">底面に露出した気孔の評価</text><text x="89" y="598" font-size="24" font-weight="400" fill="#192f39">試験片を切り出す前から同じ種類の気孔が素材全体に分布していれば、有効体積法が候補になります。</text><line x1="62" y1="659" x2="1218" y2="659" stroke="#c4d1c8" stroke-width="1.2"/><a href="https://store.astm.org/c1322-25.html" target="_blank" rel="noopener" aria-label="参考　ASTM C1322 §5.9"><text x="65" y="690" font-size="16" font-weight="500" fill="#4d6566">参考　ASTM C1322 §5.9</text></a><text x="1218" y="690" font-size="17" font-weight="600" fill="#4d6566" text-anchor="end">2 / 14</text></svg></section>
<section class="slide-frame" id="s3" aria-label="3枚目　3点曲げの引張応力分布"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" class="slide" role="group" aria-labelledby="title3 desc3" font-family="'Deck Sans','Noto Sans CJK JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif"><title id="title3">3点曲げの引張応力分布</title><desc id="desc3">矩形断面の弾性梁を単純支持し、中央に集中荷重をかけます。曲げによる最大引張応力は中央の底面で3FL/(2bh²)です。各位置の引張応力を最大引張応力で割った値を応力比rとし、rのm乗を重みとします。mが10で応力比が0.5なら、その位置の重みは中央底面の重みの約0.10%です。</desc><rect x="0" y="0" width="1280" height="720" fill="#faf8f0"/><text x="64" y="99" font-size="48" font-weight="700" fill="#192f39" font-family="'Deck Serif','Noto Serif CJK JP','Hiragino Mincho ProN','Yu Mincho',serif">3点曲げの引張応力分布</text><text x="65" y="156" font-size="24" font-weight="400" fill="#192f39">矩形断面の細長い試験片を左右2点で支え、中央に荷重 F をかける線形弾性曲げを考えます。</text><line x1="65" y1="191" x2="1217" y2="191" stroke="#c4d1c8" stroke-width="1.6"/><text x="66" y="244" font-size="26" font-weight="700" fill="#086a61">底面に沿った応力</text><text x="465" y="244" font-size="26" font-weight="700" fill="#086a61">中央断面の厚さ方向の応力</text><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 194" role="img" aria-labelledby="bp-span-t bp-span-d" x="62" y="257" width="347" height="249.32592592592593">

</svg><text x="870" y="400" font-size="23" font-weight="400" fill="#192f39">b　試験片の幅</text><text x="870" y="438" font-size="23" font-weight="400" fill="#192f39">h　上下方向の厚さ</text><text x="870" y="476" font-size="23" font-weight="400" fill="#192f39">L　支点間距離</text><rect x="65" y="530" width="1151" height="102" fill="#e7eee5"/><text x="88" y="569" font-size="23" font-weight="400" fill="#192f39">応力比 r = 各位置の引張応力 / 最大引張応力。各位置の寄与は r の m 乗で重み付けします。</text><text x="88" y="610" font-size="24" font-weight="600" fill="#086a61">ワイブル係数 m = 10 なら、応力が最大値の半分の位置での重みは中央底面の重みの約0.10%です。</text><line x1="62" y1="659" x2="1218" y2="659" stroke="#c4d1c8" stroke-width="1.2"/><a href="https://www.nist.gov/publications/weibull-strength-scaling-standardized-rectangular-flexure-specimens" target="_blank" rel="noopener" aria-label="参考　Quinn (2003)"><text x="65" y="690" font-size="16" font-weight="500" fill="#4d6566">参考　Quinn (2003)</text></a><text x="1218" y="690" font-size="17" font-weight="600" fill="#4d6566" text-anchor="end">3 / 14</text></svg></section>
<section class="slide-frame" id="s4" aria-label="4枚目　有効体積と有効面積の計算式"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" class="slide" role="group" aria-labelledby="title4 desc4" font-family="'Deck Sans','Noto Sans CJK JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif"><title id="title4">有効体積と有効面積の計算式</title><desc id="desc4">幅4 mm、厚さ3 mm、支点間距離40 mm、ワイブル係数10と仮定します。有効体積は bhL/[2(m+1)²] で1.983 mm³です。底面の有効面積は bL/(m+1) で14.545 mm²、左右の側面の引張域を合わせた有効面積は hL/(m+1)² で0.992 mm²です。底面と両側面の欠陥母集団が同じなら、有効面積の合計は15.537 mm²です。</desc><rect x="0" y="0" width="1280" height="720" fill="#faf8f0"/><text x="64" y="99" font-size="48" font-weight="700" fill="#192f39" font-family="'Deck Serif','Noto Serif CJK JP','Hiragino Mincho ProN','Yu Mincho',serif">有効体積と有効面積の計算式</text><text x="65" y="153" font-size="25" font-weight="400" fill="#192f39">幅 b = 4 mm、厚さ h = 3 mm、支点間距離 L = 40 mm、ワイブル係数 m = 10 の例</text><rect x="64" y="190" width="1152" height="45" fill="#163c3b"/><text x="83" y="222" font-size="21" font-weight="600" fill="#fffdf4">欠陥の分布を仮定する領域</text><text x="509" y="222" font-size="21" font-weight="600" fill="#fffdf4">応力比の m 乗を積分した結果</text><text x="1189" y="222" font-size="21" font-weight="600" fill="#fffdf4" text-anchor="end">計算値</text><text x="84" y="273" font-size="27" font-weight="700" fill="#086a61">材料内部</text><text x="84" y="305" font-size="20" font-weight="400" fill="#4d6566">引張側の体積</text><svg xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" width="312" height="52" viewBox="0 0 312 52" version="1.1" x="510" y="246" aria-label="Veff = bhL / [2(m+1)²]" role="img">

<section class="slide-frame" id="s5" aria-label="5枚目　ワイブル係数の推定と破壊確率の換算"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" class="slide" role="group" aria-labelledby="title5 desc5" font-family="'Deck Sans','Noto Sans CJK JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif"><title id="title5">ワイブル係数の推定と破壊確率の換算</title><desc id="desc5">寸法・仕上げ・負荷条件をそろえた複数の試験片の破壊強度から、ワイブル係数mと試験片の特性強度シグマ・シータを推定します。有効体積や有効面積はその後で計算できます。対象の梁と試験片で欠陥母集団が共通なら、対応する有効量の比Rを使って対象の梁の破壊確率に換算できます。</desc><rect x="0" y="0" width="1280" height="720" fill="#faf8f0"/><text x="64" y="99" font-size="48" font-weight="700" fill="#192f39" font-family="'Deck Serif','Noto Serif CJK JP','Hiragino Mincho ProN','Yu Mincho',serif">ワイブル係数の推定と破壊確率の換算</text><text x="65" y="155" font-size="24" font-weight="400" fill="#192f39">寸法・仕上げ・負荷条件をそろえて試験し、同じ種類の欠陥が破壊を支配する場合を考えます。</text><line x1="65" y1="188" x2="1217" y2="188" stroke="#c4d1c8" stroke-width="1.6"/><line x1="634" y1="218" x2="634" y2="492" stroke="#c4d1c8" stroke-width="1.6"/><text x="66" y="251" font-size="31" font-weight="700" fill="#086a61">試験データから m を求める</text><text x="66" y="307" font-size="24" font-weight="400" fill="#192f39">各試験片の破壊荷重を曲げ強度に換算。</text><svg xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" width="130" height="59" viewBox="0 0 130 59" version="1.1" x="65" y="331" aria-label="各試験片の破壊強度 σi は3FiL/(2bh²)" role="img">

</svg><text x="665" y="442" font-size="23" font-weight="400" fill="#192f39">R は内部欠陥なら体積比、表面欠陥なら面積比です。</text><text x="665" y="481" font-size="23" font-weight="400" fill="#192f39">σ<tspan baseline-shift="sub" font-size="70%">max</tspan> には対象の最大引張応力を使います。</text><rect x="65" y="526" width="1151" height="102" fill="#163c3b"/><text x="88" y="570" font-size="30" font-weight="700" fill="#fffdf4">m は有効体積・有効面積を先に仮定せずに推定できます。</text><text x="88" y="608" font-size="24" font-weight="400" fill="#d5e5db">試験条件が同じなら、有効量の影響は特性強度 σ<tspan baseline-shift="sub" font-size="70%">θ</tspan> に含まれ、m は強度のばらつきから求まります。</text><line x1="62" y1="659" x2="1218" y2="659" stroke="#c4d1c8" stroke-width="1.2"/><a href="https://store.astm.org/standards/c1239" target="_blank" rel="noopener" aria-label="参考　ASTM C1239（母数推定）"><text x="65" y="690" font-size="16" font-weight="500" fill="#4d6566">参考　ASTM C1239（母数推定）</text></a><a href="https://store.astm.org/c1683-10r24.html" target="_blank" rel="noopener" aria-label="ASTM C1683（寸法換算）"><text x="438" y="690" font-size="16" font-weight="500" fill="#4d6566">ASTM C1683（寸法換算）</text></a><text x="1218" y="690" font-size="17" font-weight="600" fill="#4d6566" text-anchor="end">5 / 14</text></svg></section><section class="slide-frame" id="s6" aria-label="6枚目　破壊荷重から求める試験片の特性強度"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="slide" width="1280" height="720" viewBox="0 0 1280 720" role="group" aria-labelledby="title6 desc6" font-family="'Deck Sans','Noto Sans CJK JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif"><title id="title6">破壊荷重から求める試験片の特性強度</title><desc id="desc6">寸法と仕上げが同じ試験片10本がすべて破断したと仮定します。以下は教材用の模擬データです。</desc><rect x="0" y="0" width="1280" height="720" fill="#faf8f0"/><text x="64" y="48" font-size="19" font-weight="650" fill="#086a61" text-anchor="start">例題　基準試験片</text><text x="62" y="112" font-size="46" font-weight="700" fill="#192f39" text-anchor="start" font-family="'Deck Serif','Noto Serif CJK JP','Hiragino Mincho ProN','Yu Mincho',serif">破壊荷重から求める試験片の特性強度</text><text x="65" y="164" font-size="23" font-weight="400" fill="#4d6566" text-anchor="start">寸法と仕上げが同じ試験片10本がすべて破断したと仮定します。以下は教材用の模擬データです。</text><line x1="64" y1="191" x2="1217" y2="191" stroke="#c4d1c8" stroke-width="1.4"/><text x="66" y="235" font-size="25" font-weight="700" fill="#086a61" text-anchor="start">10本の破壊荷重 Fᵢ［N］</text><text x="66" y="283" font-size="25" font-weight="550" fill="#192f39" text-anchor="start">174.7　197.9　210.1　219.5　227.4　234.5　241.5　248.8　257.3　270.1</text><text x="66" y="331" font-size="22" font-weight="400" fill="#192f39" text-anchor="start">幅 4 mm、厚さ 3 mm、スパン 40 mm。破壊荷重が最も小さい試験片の強度は次のとおりです。</text><svg xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" width="641.9000" height="49" viewBox="0 0 524 40" version="1.1" x="67" y="351" role="img" aria-label="1本目の破壊強度は291.17 MPa">

t="720" viewBox="0 0 1280 720" role="group" aria-labelledby="title7 desc7" font-family="'Deck Sans','Noto Sans CJK JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif"><title id="title7">全寸法を2倍にした梁の破壊確率</title><desc id="desc7">材料と仕上げが同じ2本の梁に加える荷重を単調に増やし、最大引張応力が等しい条件で比較します。</desc><rect x="0" y="0" width="1280" height="720" fill="#faf8f0"/><text x="64" y="48" font-size="19" font-weight="650" fill="#086a61" text-anchor="start">例題　共通の荷重条件</text><text x="62" y="112" font-size="46" font-weight="700" fill="#192f39" text-anchor="start" font-family="'Deck Serif','Noto Serif CJK JP','Hiragino Mincho ProN','Yu Mincho',serif">全寸法を2倍にした梁の破壊確率</text><text x="65" y="164" font-size="23" font-weight="400" fill="#4d6566" text-anchor="start">材料と仕上げが同じ2本の梁に加える荷重を単調に増やし、最大引張応力が等しい条件で比較します。</text><line x1="64" y1="191" x2="1217" y2="191" stroke="#c4d1c8" stroke-width="1.4"/><text x="67" y="234" font-size="24" font-weight="700" fill="#086a61" text-anchor="start">3点曲げの条件</text><text x="600" y="234" font-size="24" font-weight="700" fill="#192f39" text-anchor="middle">基準試験片</text><text x="948" y="234" font-size="24" font-weight="700" fill="#192f39" text-anchor="middle">評価対象の梁</text><text x="67" y="295" font-size="23" font-weight="400" fill="#192f39" text-anchor="start">幅 b × 厚さ h × スパン L</text><text x="600" y="295" font-size="25" font-weight="550" fill="#192f39" text-anchor="middle">4 × 3 × 40 mm</text><text x="948" y="295" font-size="25" font-weight="550" fill="#192f39" text-anchor="middle">8 × 6 × 80 mm</text><line x1="66" y1="314" x2="1216" y2="314" stroke="#c4d1c8" stroke-width="1.4"/><text x="67" y="347" font-size="23" font-weight="400" fill="#192f39" text-anchor="start">中央に加える荷重 F</text><text x="600" y="347" font-size="25" font-weight="550" fill="#192f39" text-anchor="middle">180 N</text><text x="948" y="347" font-size="25" font-weight="550" fill="#192f39" text-anchor="middle">720 N</text><line x1="66" y1="366" x2="1216" y2="366" stroke="#c4d1c8" stroke-width="1.4"/><text x=" 8" x2="1216" y2="298" stroke="#c4d1c8" stroke-width="1.4"/><text x="69" y="327" font-size="21" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">hr</text><text x="217" y="327" font-size="20" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">3[mm]</text><text x="661" y="327" font-size="21" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">bt</text><text x="827" y="327" font-size="20" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">gScale*br</text><line x1="65" y1="343" x2="1216" y2="343" stroke="#c4d1c8" stroke-width="1.4"/><text x="69" y="372" font-size="21" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">Lr</text><text x="217" y="372" font-size="20" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">40[mm]</text><text x="661" y="372" font-size="21" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">ht</text><text x="827" y="372" font-size="20" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">gScale*hr</text><line x1="65" y1="388" x2="1216" y2="388" stroke="#c4d1c8" stroke-width="1.4"/><text x="69" y="417" font-size="21" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">mW</text><text x="217" y="417" font-size="20" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">10</text><text x="661" y="417" font-size="21" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">Lt</text><text x="827" y="417" font-size="20" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">gScale*Lr</text><line x1="65" y1="433" x2="1216" y2="433" stroke="#c4d1c8" stroke-width="1.4"/><text x="69" y="462" font-size="21" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">sigRef</text><text x="217" y="462" font-size="20" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">400[MPa]</text><text x="661" y="462" font-size="21" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">Fapp</text><text x="827" y="462" font-size="20" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">720[N]</text><line x1="65" y1="478" x2="1216" y2="478" stroke="#c4d1c8" stroke-width="1.4"/><text x="69" y="507" font-size="21" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">Vr</text><text x="217" y="507" font-size="20" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">br*hr*Lr/(2*(mW+1)^2)</text><text x="661" y="507" font-size="21" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">sigNom</text><text x="827" y="507" font-size="20" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">3*Fapp*Lt/(2*bt*ht^2)</text><line x1="65" y1="523" x2="1216" y2="523" stroke="#c4d1c8" stroke-width="1.4"/><text x="69" y="554" font-size="21" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">Ar</text><text x="217" y="554" font-size="20" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">br*Lr/(mW+1)+hr*Lr/(mW+1)^2</text><text x="660" y="554" font-size="21" font-weight="400" fill="#192f39" text-anchor="start">底面と両側面を合わせた基準有効面積</text><rect x="65" y="585" width="1150" height="58" fill="#e9f1e8"/><text x="81" y="622" font-size="24" font-weight="650" fill="#086a61" text-anchor="start">入力後の照合　Vr = 1.98347 mm³　　Ar = 15.5372 mm²　　sigNom = 300 MPa</text><line x1="64" y1="661" x2="1217" y2="661" stroke="#c4d1c8" stroke-width="1.4"/><text x="65" y="689" font-size="15" font-weight="450" fill="#4d6566" text-anchor="start">長さには [mm]、応力には [MPa] を明記します。Vr と Ar には基準試験片の値を使い、対象の梁の寸法を変えてもこの値は固定します。</text><text x="1218" y="689" font-size="17" font-weight="600" fill="#4d6566" text-anchor="end">11 / 14</text></svg></section><section class="slide-frame" id="s12" aria-label="12枚目　体積積分と面積積分の範囲"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="slide" width="1280" height="720" viewBox="0 0 1280 720" role="group" aria-labelledby="title12 desc12" font-family="'Deck Sans','Noto Sans CJK JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif"><title id="title12">体積積分と面積積分の範囲</title><desc id="desc12">支点間の部分だけを直方体で表し、理論応力分布を使って積分範囲と単位を確認します。</desc><rect x="0" y="0" width="1280" height="720" fill="#faf8f0"/><text x="64" y="48" font-size="19" font-weight="650" fill="#086a61" text-anchor="start">補足　積分演算子</text><text x="62" y="112" font-size="46" font-weight="700" fill="#192f39" text-anchor="start" font-family="'Deck Serif','Noto Serif CJK JP','Hiragino Mincho ProN','Yu Mincho',serif">体積積分と面積積分の範囲</text><text x="65" y="164" font-size="23" font-weight="400" fill="#4d6566" text-anchor="start">支点間の部分だけを直方体で表し、理論応力分布を使って積分範囲と単位を確認します。</text><line x1="64" y1="191" x2="1217" y2="191" stroke="#c4d1c8" stroke-width="1.4"/><text x="66" y="231" font-size="25" font-weight="700" fill="#086a61" text-anchor="start">形状と積分範囲</text><text x="66" y="275" font-size="22" font-weight="400" fill="#192f39" text-anchor="start">Block の寸法は (Lt, bt, ht)、基点は (−Lt/2, −bt/2, −ht/2)。x、y、z は順に長手・幅・高さ方向です。</text><text x="66" y="314" font-size="22" font-weight="400" fill="#192f39" text-anchor="start">Component 1 › Definitions › Nonlocal Couplings › Integration を2つ追加します。</text><rect x="65" y="344" width="1150" height="45" fill="#e9f1e8"/><text x="78" y="375" font-size="21" font-weight="650" fill="#086a61" text-anchor="start">Operator name</text><text x="358" y="375" font-size="21" font-weight="650" fill="#086a61" text-anchor="start">Geometric entity level</text><text x="696" y="375" font-size="21" font-weight="650" fill="#086a61" text-anchor="start">積分する領域・境界</text><text x="81" y="430" font-size="23" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">intV</text><text x="360" y="430" font-size="23" font-weight="400" fill="#192f39" text-anchor="start">Domain（領域）</text><text x="696" y="430" font-size="23" font-weight="400" fill="#192f39" text-anchor="start">材料の全領域。治具は除く。</text><line x1="65" y1="447" x2="1215" y2="447" stroke="#c4d1c8" stroke-width="1.4"/><text x="81" y="486" font-size="23" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">intA</text><text x="360" y="486" font-size="23" font-weight="400" fill="#192f39" text-anchor="start">Boundary（境界）</text><text x="696" y="486" font-size="22" font-weight="400" fill="#192f39" text-anchor="start">底面 z = −ht/2 と両側面 y = ±bt/2。</text><text x="66" y="550" font-size="22" font-weight="700" fill="#086a61" text-anchor="start">積分範囲の検算</text><text x="303" y="550" font-size="22" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">intV(1)</text><text x="442" y="550" font-size="23" font-weight="400" fill="#192f39" text-anchor="start">= 3,840 mm³</text><text x="698" y="550" font-size="22" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">intA(1)</text><text x="841" y="550" font-size="23" font-weight="400" fill="#192f39" text-anchor="start">= 1,600 mm²</text><text x="66" y="609" font-size="21" font-weight="450" fill="#192f39" text-anchor="start">左右の側面はそれぞれ全面を選び、圧縮側の重みは応力式で0にします。対称面や内部境界は面積積分から除きます。</text><line x1="64" y1="661" x2="1217" y2="661" stroke="#c4d1c8" stroke-width="1.4"/><text x="65" y="689" font-size="15" font-weight="450" fill="#4d6566" text-anchor="start">片側の側面だけ加工状態が異なる場合は、その面の欠陥母集団と試験片の表面条件を別途照合します。</text><a href="https://doc.comsol.com/6.3/doc/com.comsol.help.comsol/comsol_ref_definitions.21.096.html" xlink:href="https://doc.comsol.com/6.3/doc/com.comsol.help.comsol/comsol_ref_definitions.21.096.html" target="_blank" rel="noopener noreferrer"><text x="934" y="689" font-size="15" font-weight="500" fill="#086a61" text-anchor="start">COMSOL 6.3　Integration</text></a><text x="1218" y="689" font-size="17" font-weight="600" fill="#4d6566" text-anchor="end">12 / 14</text></svg></section><section class="slide-frame" id="s13" aria-label="13枚目　局所応力の分布から求める破壊確率"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="slide" width="1280" height="720" viewBox="0 0 1280 720" role="group" aria-labelledby="title13 desc13" font-family="'Deck Sans','Noto Sans CJK JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif"><title id="title13">局所応力の分布から求める破壊確率</title><desc id="desc13">720 N の理論値を再現します。sigRef は基準試験片の特性強度です。(sigUse/sigRef)^mW を積分します。</desc><rect x="0" y="0" width="1280" height="720" fill="#faf8f0"/><text x="64" y="48" font-size="19" font-weight="650" fill="#086a61" text-anchor="start">補足　入力する式</text><text x="62" y="112" font-size="46" font-weight="700" fill="#192f39" text-anchor="start" font-family="'Deck Serif','Noto Serif CJK JP','Hiragino Mincho ProN','Yu Mincho',serif">局所応力の分布から求める破壊確率</text><text x="65" y="164" font-size="23" font-weight="400" fill="#4d6566" text-anchor="start">720 N の理論値を再現します。sigRef は基準試験片の特性強度です。(sigUse/sigRef)^mW を積分します。</text><line x1="64" y1="191" x2="1217" y2="191" stroke="#c4d1c8" stroke-width="1.4"/><text x="66" y="231" font-size="24" font-weight="700" fill="#086a61" text-anchor="start">Component 1 › Definitions › Variables</text><text x="67" y="276" font-size="21" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">sigBeam</text><text x="213" y="276" font-size="21" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">sigNom*(1-2*abs(x)/Lt)*max(-2*z/ht,0)</text><text x="888" y="276" font-size="19" font-weight="450" fill="#4d6566" text-anchor="start">理想梁の引張応力 [Pa]</text><line x1="66" y1="288" x2="1215" y2="288" stroke="#c4d1c8" stroke-width="1.4"/><text x="67" y="316" font-size="21" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">sigUse</text><text x="213" y="316" font-size="21" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">sigBeam</text><text x="888" y="316" font-size="19" font-weight="450" fill="#4d6566" text-anchor="start">照合に使う応力 [Pa]</text><line x1="66" y1="328" x2="1215" y2="328" stroke="#c4d1c8" stroke-width="1.4"/><text x="67" y="356" font-size="21" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">HV</text><text x="213" y="356" font-size="21" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">intV((sigUse/sigRef)^mW)/Vr</text><text x="888" y="356" font-size="19" font-weight="450" fill="#4d6566" text-anchor="start">体積法の累積ハザード [1]</text><line x1="66" y1="368" x2="1215" y2="368" stroke="#c4d1c8" stroke-width="1.4"/><text x="67" y="396" font-size="21" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">HA</text><text x="213" y="396" font-size="21" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">intA((sigUse/sigRef)^mW)/Ar</text><text x="888" y="396" font-size="19" font-weight="450" fill="#4d6566" text-anchor="start">面積法の累積ハザード [1]</text><line x1="66" y1="408" x2="1215" y2="408" stroke="#c4d1c8" stroke-width="1.4"/><text x="67" y="436" font-size="21" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">PfV</text><text x="213" y="436" font-size="21" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">1-exp(-HV)</text><text x="888" y="436" font-size="19" font-weight="450" fill="#4d6566" text-anchor="start">体積法の破壊確率 [1]</text><line x1="66" y1="448" x2="1215" y2="448" stroke="#c4d1c8" stroke-width="1.4"/><text x="67" y="476" font-size="21" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">PfA</text><text x="213" y="476" font-size="21" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">1-exp(-HA)</text><text x="888" y="476" font-size="19" font-weight="450" fill="#4d6566" text-anchor="start">面積法の破壊確率 [1]</text><line x1="66" y1="488" x2="1215" y2="488" stroke="#c4d1c8" stroke-width="1.4"/><text x="66" y="524" font-size="22" font-weight="700" fill="#086a61" text-anchor="start">Results › Derived Values › Global Evaluation</text><text x="67" y="562" font-size="21" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">comp1.PfV</text><text x="240" y="562" font-size="22" font-weight="400" fill="#192f39" text-anchor="start">= 0.362696</text><text x="529" y="562" font-size="21" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">comp1.PfA</text><text x="705" y="562" font-size="22" font-weight="400" fill="#192f39" text-anchor="start">= 0.201687</text><rect x="65" y="582" width="1150" height="65" fill="#e9f1e8"/><text x="80" y="609" font-size="19" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">comp1.intV((comp1.sigUse/sigNom)^mW)</text><text x="538" y="609" font-size="20" font-weight="650" fill="#086a61" text-anchor="start">= 15.8678 mm³</text><text x="80" y="635" font-size="19" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">comp1.intA((comp1.sigUse/sigNom)^mW)</text><text x="538" y="635" font-size="20" font-weight="650" fill="#086a61" text-anchor="start">= 62.1488 mm²</text><text x="806" y="626" font-size="21" font-weight="500" fill="#192f39" text-anchor="start">720 N での有効量の照合</text><line x1="64" y1="661" x2="1217" y2="661" stroke="#c4d1c8" stroke-width="1.4"/><text x="65" y="689" font-size="15" font-weight="450" fill="#4d6566" text-anchor="start">照合用の解データが必要な場合は、無荷重の線形弾性体の任意の1面を固定して定常解を求め、その解を使って上記の解析式を評価します。</text><text x="1218" y="689" font-size="17" font-weight="600" fill="#4d6566" text-anchor="end">13 / 14</text></svg></section><section class="slide-frame" id="s14" aria-label="14枚目　有限要素解析の応力を使った破壊確率の評価"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="slide" width="1280" height="720" viewBox="0 0 1280 720" role="group" aria-labelledby="title14 desc14" font-family="'Deck Sans','Noto Sans CJK JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif"><title id="title14">有限要素解析の応力を使った破壊確率の評価</title><desc id="desc14">理論応力分布で積分を検算してから、荷重・支持条件・材料を設定した有限要素解析の定常解に切り替えます。</desc><rect x="0" y="0" width="1280" height="720" fill="#faf8f0"/><text x="64" y="48" font-size="19" font-weight="650" fill="#086a61" text-anchor="start">補足　実部品への適用</text><text x="62" y="112" font-size="46" font-weight="700" fill="#192f39" text-anchor="start" font-family="'Deck Serif','Noto Serif CJK JP','Hiragino Mincho ProN','Yu Mincho',serif">有限要素解析の応力を使った破壊確率の評価</text><text x="65" y="164" font-size="23" font-weight="400" fill="#4d6566" text-anchor="start">理論応力分布で積分を検算してから、荷重・支持条件・材料を設定した有限要素解析の定常解に切り替えます。</text><line x1="64" y1="191" x2="1217" y2="191" stroke="#c4d1c8" stroke-width="1.4"/><text x="66" y="233" font-size="25" font-weight="700" fill="#086a61" text-anchor="start">3Dの曲げ解析</text><text x="66" y="274" font-size="20" font-weight="400" fill="#192f39" text-anchor="start">Solid Mechanics と Stationary を使用し、材料のヤング率とポアソン比、試験片の実長を入力します。</text><text x="66" y="310" font-size="20" font-weight="400" fill="#192f39" text-anchor="start">支点間距離は Lt とし、実際のローラまたは有限幅の荷重面・支持面を設定します。中央の下向き総荷重は Fapp です。</text><text x="66" y="346" font-size="20" font-weight="400" fill="#192f39" text-anchor="start">支持部では回転と長手方向の伸びを許し、剛体としての移動と回転だけを必要最小限の拘束で抑えます。</text><line x1="65" y1="369" x2="1216" y2="369" stroke="#c4d1c8" stroke-width="1.4"/><text x="66" y="410" font-size="24" font-weight="700" fill="#086a61" text-anchor="start">単軸曲げの応力</text><text x="484" y="410" font-size="22" font-weight="500" fill="#192f39" text-anchor="start" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">sigUse = max(solid.sx,0[Pa])</text><text x="66" y="450" font-size="22" font-weight="400" fill="#192f39" text-anchor="start">x 方向の引張応力を使い、前頁の式で HV、HA、PfV、PfA を評価します。</text><text x="66" y="488" font-size="19" font-weight="450" fill="#4d6566" text-anchor="start">多軸応力場で最大主応力モデルを使う場合は max(solid.sp1,0[Pa]) を用います。破壊の起点と応力基準は別途検証します。</text><rect x="65" y="518" width="1150" height="124" fill="#e9f1e8"/><text x="80" y="552" font-size="23" font-weight="700" fill="#086a61" text-anchor="start">収束の確認</text><text x="80" y="586" font-size="19" font-weight="400" fill="#192f39" text-anchor="start">中央底面の引張応力と左右の支点の鉛直反力（対称なら各360 N）を確認し、次に HV と HA の変化を確認します。</text><text x="80" y="620" font-size="19" font-weight="400" fill="#192f39" text-anchor="start">メッシュの細分化と積分次数の引き上げは別々に行います。接触端の局所応力が支配的ならローラ形状・接触幅と破面を照合します。</text><line x1="64" y1="661" x2="1217" y2="661" stroke="#c4d1c8" stroke-width="1.4"/><text x="65" y="689" font-size="15" font-weight="450" fill="#4d6566" text-anchor="start">破壊の起点が底面の加工傷だけなら intA は底面に限り、基準試験片も Ar = br*Lr/(mW+1) とします。</text><a href="https://doc.comsol.com/6.3/doc/com.comsol.help.sme/sme_ug_theory.06.017.html" xlink:href="https://doc.comsol.com/6.3/doc/com.comsol.help.sme/sme_ug_theory.06.017.html" target="_blank" rel="noopener noreferrer"><text x="843" y="689" font-size="15" font-weight="500" fill="#086a61" text-anchor="start">応力の符号</text></a><a href="https://doc.comsol.com/6.3/doc/com.comsol.help.sme/sme_ug_theory.06.018.html" xlink:href="https://doc.comsol.com/6.3/doc/com.comsol.help.sme/sme_ug_theory.06.018.html" target="_blank" rel="noopener noreferrer"><text x="950" y="689" font-size="15" font-weight="500" fill="#086a61" text-anchor="start">主応力</text></a><a href="https://doc.comsol.com/6.3/doc/com.comsol.help.comsol/comsol_ref_definitions.21.100.html" xlink:href="https://doc.comsol.com/6.3/doc/com.comsol.help.comsol/comsol_ref_definitions.21.100.html" target="_blank" rel="noopener noreferrer"><text x="1029" y="689" font-size="15" font-weight="500" fill="#086a61" text-anchor="start">積分の設定</text></a><text x="1218" y="689" font-size="17" font-weight="600" fill="#4d6566" text-anchor="end">14 / 14</text></svg></section></div>

</main><script>(() => {
  'use strict';

  function prepareDeck() {
    const viewer = document.getElementById('viewer');
    const track = document.getElementById('frames');
    const frames = Array.from(track?.querySelectorAll('.slide-frame') || []);
    if (!viewer || frames.length === 0) return;

    const byId = id => document.getElementById(id);
    const previous = byId('prev');
    const next = byId('next');
    const position = byId('position');
    const jump = byId('jump');
    const links = Array.from(document.querySelectorAll('[data-slide-number]'));
    let current = 0;

    function pageFromHash() {
      const value = /^#s([1-9]\d*)$/.exec(location.hash);
      const index = value ? Number(value[1]) - 1 : 0;
      return index >= 0 && index < frames.length ? index : 0;
    }

    function render(index) {
      const focusMoved = index !== current && frames[current].contains(document.activeElement);
      current = index;
      frames.forEach((frame, i) => {
        const active = i === index;
        frame.classList.toggle('active', active);
        frame.toggleAttribute('inert', !active);
        if (active) frame.removeAttribute('aria-hidden');
        else frame.setAttribute('aria-hidden', 'true');
      });
      links.forEach(link => {
        const active = Number(link.dataset.slideNumber) === index + 1;
        if (active) link.setAttribute('aria-current', 'page');
        else link.removeAttribute('aria-current');
      });
      if (jump) jump.value = String(current + 1);
      if (previous) previous.disabled = index === 0;
      if (next) next.disabled = index === frames.length - 1;
      if (position) position.textContent = (index + 1) + ' / ' + frames.length;
      if (focusMoved) {
        const heading = frames[index].querySelector('h1,h2') || frames[index];
        heading.setAttribute('tabindex', '-1');
        heading.focus({preventScroll: true});
      }
    }

    function goTo(index) {
      if (!Number.isInteger(index) || index < 0 || index >= frames.length || index === current) return;
      render(index);
      const hash = '#s' + (index + 1);
      try { history.pushState(null, '', hash); }
      catch { location.hash = hash; }
    }

    jump?.addEventListener('change', () => goTo(Number(jump.value) - 1));
    previous?.addEventListener('click', () => goTo(current - 1));
    next?.addEventListener('click', () => goTo(current + 1));
    links.forEach(link => link.addEventListener('click', event => {
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button !== 0) return;
      event.preventDefault();
      goTo(Number(link.dataset.slideNumber) - 1);
    }));
    window.addEventListener('hashchange', () => render(pageFromHash()));
    window.addEventListener('popstate', () => render(pageFromHash()));
    document.addEventListener('keydown', event => {
      if (event.defaultPrevented || event.altKey || event.metaKey || event.ctrlKey || event.shiftKey ||
          event.target.closest?.('input,textarea,select,[contenteditable="true"],dialog[open]')) return;
      let index;
      switch (event.key) {
        case 'ArrowRight': case 'PageDown': index = current + 1; break;
        case 'ArrowLeft': case 'PageUp': index = current - 1; break;
        case 'Home': index = 0; break;
        case 'End': index = frames.length - 1; break;
        default: return;
      }
      event.preventDefault();
      goTo(index);
    });

    let start = null;
    track.addEventListener('pointerdown', event => {
      if (event.pointerType !== 'touch') return;
      if (!event.isPrimary || event.target.closest?.('a,button,input,select,textarea')) {
        start = null;
        return;
      }
      start = {id: event.pointerId, x: event.clientX, y: event.clientY};
    });
    track.addEventListener('pointercancel', () => { start = null; });
    track.addEventListener('pointerup', event => {
      if (!start || event.pointerId !== start.id) return;
      const dx = event.clientX - start.x;
      const dy = event.clientY - start.y;
      start = null;
      if (Math.abs(dx) >= 45 && Math.abs(dx) > 1.5 * Math.abs(dy)) goTo(current + (dx < 0 ? 1 : -1));
    });

    const full = byId('fullscreen');
    if (full) {
      const screen = document.documentElement;
      const request = screen.requestFullscreen || screen.webkitRequestFullscreen;
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      const isFull = () => Boolean(document.fullscreenElement || document.webkitFullscreenElement);
      if (!request || !exit || document.fullscreenEnabled === false) full.hidden = true;
      else {
        const sync = () => {
          full.setAttribute('aria-pressed', String(isFull()));
          full.setAttribute('title', isFull() ? '全画面表示を終了' : '全画面表示');
        };
        full.addEventListener('click', async () => {
          try {
            if (isFull()) await exit.call(document);
            else await request.call(screen);
          } catch { sync(); }
        });
        document.addEventListener('fullscreenchange', sync);
        document.addEventListener('webkitfullscreenchange', sync);
        sync();
      }
    }
    byId('print')?.addEventListener('click', () => window.print());
    window.addEventListener('beforeprint', () => frames.forEach(frame => {
      frame.removeAttribute('inert');
      frame.removeAttribute('aria-hidden');
    }));
    window.addEventListener('afterprint', () => render(current));

    render(pageFromHash());
    viewer.classList.add('deck-ready');
    document.documentElement.classList.add('deck-ready');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', prepareDeck, {once: true});
  else prepareDeck();
})();
</script><script>(() => {
  const input = document.getElementById('practice-force');
  if (!input) return;
  function refresh() {
    const force = Number(input.value);
    const stress = force * 5 / 12;
    const base = (stress / 400) ** 10;
    const pct = ratio => (-100 * Math.expm1(-ratio * base)).toFixed(2) + '%';
    const stressText = Number(stress.toFixed(2)) + ' MPa';
    document.getElementById('v-load').textContent = force + ' N';
    document.getElementById('v-stress').textContent = stressText;
    document.getElementById('v-volume').textContent = pct(8);
    document.getElementById('v-area').textContent = pct(4);
    document.getElementById('practice-status').textContent = '中央荷重 ' + force + ' N、最大引張応力 ' + stressText + '、体積法 ' + pct(8) + '、面積法 ' + pct(4);
    input.setAttribute('aria-valuetext', force + ' ニュートン');
  }
  input.addEventListener('input', refresh);
  refresh();
})();</script></body></html>
